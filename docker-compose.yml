version: '3.8'

services:
  jonova-app:
    build: .
    ports:
      - "8914:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  jonova-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8915:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev
    restart: unless-stopped
